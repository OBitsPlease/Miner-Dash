name: Build macOS and Linux installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        default: 1.0.4
        type: string
      publish_to_release:
        description: Upload the packages to the matching vX.Y.Z release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: controller-installers-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runs-on: ubuntu-latest
          - target: macos
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: Validate workflow inputs
        run: |
          case '${{ inputs.version }}' in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo 'Version must look like 1.0.3 and must not include the v prefix.' >&2; exit 1 ;;
          esac

      - name: Build controller packages
        run: ./scripts/build-controller-packages.sh --target '${{ matrix.target }}' --version '${{ inputs.version }}'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: minerdash-controller-${{ inputs.version }}-${{ matrix.target }}
          path: |
            build/*.deb
            build/*.pkg
            build/*.tar.gz
            build/*.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Publish packages to release
        if: ${{ inputs.publish_to_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          files=$(ls build/*.deb build/*.pkg build/*.tar.gz build/*.sha256 2>/dev/null || true)
          [ -n "$files" ] || { echo 'no packages were produced' >&2; exit 1; }
          # shellcheck disable=SC2086
          gh release upload "v${{ inputs.version }}" $files \
            --repo '${{ github.repository }}' --clobber
